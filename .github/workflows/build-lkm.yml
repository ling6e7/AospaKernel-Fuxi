name: 构建 LKM 友好内核

# 目标:
# - 不编入 Re:Kernel
# - CONFIG_MODULES 全开, 便于任意 out-of-tree .ko 加载
# - 关闭 ThinLTO / 符号裁剪 / 强制模块签名, 降低 OOT 模块门槛
# - 产出刷机包 + Module.symvers / .config 等开发包

on:
  workflow_dispatch:
    inputs:
      disable_lto:
        description: '关闭 Clang ThinLTO (推荐, 便于编任意 .ko)'
        required: false
        default: true
        type: boolean
      keep_ksu:
        description: '保留 ReSukiSU 内置'
        required: false
        default: true
        type: boolean
      build_tree_modules:
        description: '同时编译树内 =m 模块 (更完整 Module.symvers, 更慢)'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - LKM-Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LOCALVERSION: -AOSPA-LKM-BY@ling6e7

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg libssl-dev libelf-dev \
            cpio zip xz-utils wget python3 rsync

      - name: Setup Neutron Clang
        run: |
          mkdir -p toolchains/clang
          cd toolchains/clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          echo "CLANG_PATH=$(pwd)/bin" >> "$GITHUB_ENV"
          ./bin/clang --version | head -3

      # push 事件下 inputs.* 为空; 默认 keep_ksu=true
      - name: Resolve build options
        run: |
          # workflow_dispatch 用 inputs; push 用默认值
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            KEEP_KSU='${{ inputs.keep_ksu }}'
            DISABLE_LTO='${{ inputs.disable_lto }}'
            BUILD_TREE_MODULES='${{ inputs.build_tree_modules }}'
          else
            KEEP_KSU=true
            DISABLE_LTO=true
            BUILD_TREE_MODULES=true
          fi
          # 规范化空值
          : "${KEEP_KSU:=true}"
          : "${DISABLE_LTO:=true}"
          : "${BUILD_TREE_MODULES:=true}"
          {
            echo "KEEP_KSU=${KEEP_KSU}"
            echo "DISABLE_LTO=${DISABLE_LTO}"
            echo "BUILD_TREE_MODULES=${BUILD_TREE_MODULES}"
          } >> "$GITHUB_ENV"
          echo "options: KEEP_KSU=${KEEP_KSU} DISABLE_LTO=${DISABLE_LTO} BUILD_TREE_MODULES=${BUILD_TREE_MODULES}"

      - name: Setup ReSukiSU (optional)
        if: ${{ env.KEEP_KSU != 'false' }}
        run: |
          rm -rf KernelSU
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          rm -f drivers/kernelsu
          ln -sf ../KernelSU/kernel drivers/kernelsu
          # 确保 Kconfig 存在 (drivers/Kconfig source 它)
          if [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "drivers/kernelsu/Kconfig missing after clone" >&2
            ls -la KernelSU/kernel || true
            exit 1
          fi
          echo "KSU_ENABLED=1" >> "$GITHUB_ENV"
          echo "KSU_HEAD=$(cd KernelSU && git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Stub KernelSU if not vendored
        # keep_ksu=false 或 setup 失败/跳过时, 避免 fuxi_defconfig 因缺 Kconfig 失败
        run: |
          if [ -e drivers/kernelsu/Kconfig ] || [ -L drivers/kernelsu ]; then
            echo "KernelSU present, skip stub"
            exit 0
          fi
          echo "Stubbing drivers/kernelsu (KSU disabled / not vendored)"
          rm -rf drivers/kernelsu
          mkdir -p drivers/kernelsu
          printf 'obj-y :=\n' > drivers/kernelsu/Makefile
          cat > drivers/kernelsu/Kconfig <<'EOF'
          menu "KernelSU (disabled for this LKM build)"
          config KSU
          	bool "KernelSU"
          	default n
          config KSU_DEBUG
          	bool
          	depends on KSU
          	default n
          config KSU_MULTI_MANAGER_SUPPORT
          	bool
          	depends on KSU
          	default n
          endmenu
          EOF
          DEF=arch/arm64/configs/fuxi_defconfig
          sed -i \
            -e '/^CONFIG_KSU=/d' \
            -e '/^CONFIG_KSU_DEBUG=/d' \
            -e '/^CONFIG_KSU_MULTI_MANAGER_SUPPORT=/d' \
            "$DEF"
          {
            echo '# CONFIG_KSU is not set'
            echo '# CONFIG_KSU_DEBUG is not set'
            echo '# CONFIG_KSU_MULTI_MANAGER_SUPPORT is not set'
          } >> "$DEF"
          echo "KSU_ENABLED=0" >> "$GITHUB_ENV"

      - name: Ensure Re:Kernel is NOT built-in
        run: |
          # 彻底排除 rekernel: 不拉源码, 并清掉可能残留的树内入口
          rm -rf Re-Kernel drivers/rekernel
          mkdir -p drivers/rekernel
          # 空 Makefile, 即使 Kconfig 被误开也不会编出目标
          printf 'obj-y :=\n' > drivers/rekernel/Makefile
          # drivers/Kconfig 会 source rekernel/Kconfig, 提供最小 stub 且 default n
          cat > drivers/rekernel/Kconfig <<'EOF'
          menu "Re:Kernel (disabled for LKM build)"
          config REKERNEL
          	bool "Re:Kernel (forced off in LKM workflow)"
          	depends on MODULES
          	default n
          config REKERNEL_NETWORK
          	bool
          	depends on REKERNEL
          	default n
          endmenu
          EOF
          # 去掉 defconfig 里的 rekernel 强制开启
          DEF=arch/arm64/configs/fuxi_defconfig
          sed -i \
            -e '/^CONFIG_REKERNEL=/d' \
            -e '/^CONFIG_REKERNEL_NETWORK=/d' \
            "$DEF"
          {
            echo '# CONFIG_REKERNEL is not set'
            echo '# CONFIG_REKERNEL_NETWORK is not set'
          } >> "$DEF"
          echo "REKERNEL_DISABLED=1" >> "$GITHUB_ENV"

      - name: Prepare ccache
        run: mkdir -p ~/.ccache

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-lkm-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            ccache-lkm-${{ github.ref_name }}-
            ccache-lkm-

      - name: Configure for arbitrary OOT LKM
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${CLANG_PATH}:/usr/lib/ccache:$PATH"
          export CCACHE_DIR=~/.ccache
          ccache -M 10G
          ccache -z

          MAKE=(make LLVM=1 LLVM_IAS=1 O=out "LOCALVERSION=${LOCALVERSION}")

          "${MAKE[@]}" fuxi_defconfig -j"$(nproc)"

          CFG=out/.config
          sc() { scripts/config --file "$CFG" "$@"; }

          # ---- 模块子系统: 任意 .ko 加载的基础 ----
          sc --enable MODULES
          sc --enable MODULE_UNLOAD
          sc --enable MODULE_FORCE_UNLOAD || true
          sc --enable MODVERSIONS || true
          # 不强制签名, 避免未签名 OOT 模块无法加载
          sc --disable MODULE_SIG || true
          sc --disable MODULE_SIG_ALL || true
          sc --disable MODULE_SIG_FORCE || true
          sc --disable MODULE_SIG_PROTECT || true
          # 不裁剪导出符号, 否则 OOT 模块易缺符号
          sc --disable TRIM_UNUSED_KSYMS || true
          sc --disable UNUSED_KSYMS_WHITELIST || true
          # 调试/解析符号
          sc --enable KALLSYMS
          sc --enable KALLSYMS_ALL || true
          sc --enable IKCONFIG || true
          sc --enable IKCONFIG_PROC || true
          sc --enable IKHEADERS || true

          # ---- 关闭 ThinLTO: OOT 模块与内核 ABI/编译一致性更稳 ----
          # 使用 Resolve build options 写入的 DISABLE_LTO (push 安全)
          if [ "${DISABLE_LTO:-true}" != "false" ]; then
            sc --disable LTO_CLANG_THIN || true
            sc --disable LTO_CLANG_FULL || true
            sc --disable LTO_CLANG || true
            sc --enable LTO_NONE || true
            echo "LTO=off" >> "$GITHUB_ENV"
          else
            echo "LTO=thin(kept)" >> "$GITHUB_ENV"
          fi

          # ---- 明确关掉 Re:Kernel ----
          sc --disable REKERNEL || true
          sc --disable REKERNEL_NETWORK || true

          # ---- KSU 可选 (KEEP_KSU 来自 env) ----
          if [ "${KEEP_KSU:-true}" = "false" ] || [ ! -e drivers/kernelsu/Kconfig ]; then
            sc --disable KSU || true
            sc --disable KSU_DEBUG || true
            sc --disable KSU_MULTI_MANAGER_SUPPORT || true
            echo "KSU_ENABLED=0" >> "$GITHUB_ENV"
          else
            # 真实 KSU 树: 启用; stub 只有 default n 的 KSU
            if [ -L drivers/kernelsu ] || [ -d KernelSU ]; then
              sc --enable KSU || true
              echo "KSU_ENABLED=1" >> "$GITHUB_ENV"
            else
              sc --disable KSU || true
              echo "KSU_ENABLED=0" >> "$GITHUB_ENV"
            fi
          fi

          "${MAKE[@]}" olddefconfig

          echo "======== final module-related config ========"
          rg -n 'CONFIG_(MODULES|MODULE_|MODVERSIONS|LTO|TRIM_UNUSED|KALLSYMS|REKERNEL|KSU|IKCONFIG|IKHEADERS)=' out/.config \
            | rg -v 'RANDOMIZE_MODULE' || true

          # 硬性检查
          grep -q '^CONFIG_MODULES=y$' out/.config
          grep -q '^# CONFIG_REKERNEL is not set$' out/.config \
            || grep -qv '^CONFIG_REKERNEL=y$' out/.config
          if ! grep -q '^CONFIG_MODULES=y$' out/.config; then
            echo "CONFIG_MODULES not enabled" >&2
            exit 1
          fi
          if grep -q '^CONFIG_REKERNEL=y$' out/.config; then
            echo "REKERNEL still enabled, abort" >&2
            exit 1
          fi

      - name: Build Image (+ tree modules)
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${CLANG_PATH}:/usr/lib/ccache:$PATH"
          export CCACHE_DIR=~/.ccache

          MAKE=(make LLVM=1 LLVM_IAS=1 O=out "LOCALVERSION=${LOCALVERSION}")
          NPROC="$(nproc)"

          # Image 必须有; modules 让 Module.symvers 覆盖树内导出
          # BUILD_TREE_MODULES 来自 Resolve build options (push 默认 true)
          if [ "${BUILD_TREE_MODULES:-true}" != "false" ]; then
            "${MAKE[@]}" Image modules -j"$NPROC" 2>&1 | tee out/build.log
          else
            # 至少 modules_prepare + vmlinux/Image, 便于外部 M= 编译
            "${MAKE[@]}" Image modules_prepare -j"$NPROC" 2>&1 | tee out/build.log
            # 再链一次确保 Module.symvers 生成
            "${MAKE[@]}" Module.symvers -j"$NPROC" 2>&1 | tee -a out/build.log || true
          fi

          test -f out/arch/arm64/boot/Image
          test -f out/Module.symvers
          ccache -s || true

          KERNELRELEASE="$("${MAKE[@]}" -s kernelrelease)"
          echo "KERNELRELEASE=${KERNELRELEASE}" >> "$GITHUB_ENV"
          echo "Kernel release: ${KERNELRELEASE}"

      - name: Smoke-test out-of-tree hello.ko
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${CLANG_PATH}:/usr/lib/ccache:$PATH"

          DEMO=/tmp/lkm_hello
          rm -rf "$DEMO"
          mkdir -p "$DEMO"
          cat > "$DEMO/hello.c" <<'EOF'
          #include <linux/module.h>
          #include <linux/init.h>
          #include <linux/kernel.h>

          static int __init hello_init(void)
          {
          	pr_info("lkm_hello: loaded on %s\n", UTS_RELEASE);
          	return 0;
          }
          static void __exit hello_exit(void)
          {
          	pr_info("lkm_hello: unloaded\n");
          }
          module_init(hello_init);
          module_exit(hello_exit);
          MODULE_LICENSE("GPL");
          MODULE_DESCRIPTION("LKM workflow smoke test");
          MODULE_AUTHOR("ling6e7");
          EOF
          cat > "$DEMO/Makefile" <<'EOF'
          obj-m += hello.o
          EOF

          make LLVM=1 LLVM_IAS=1 -C "$(pwd)/out" M="$DEMO" modules
          test -f "$DEMO/hello.ko"
          file "$DEMO/hello.ko"
          # 记录 vermagic 便于对照
          modinfo "$DEMO/hello.ko" || true
          mkdir -p out/lkm-smoke
          cp -a "$DEMO/hello.ko" out/lkm-smoke/
          cp -a "$DEMO/hello.mod.c" out/lkm-smoke/ 2>/dev/null || true
          echo "OOT hello.ko OK"

      - name: Package flashable zip + LKM devkit
        run: |
          set -euo pipefail
          STAMP="$(date -u '+%Y%m%d-%H%M')"
          ZIP_KERNEL="Fuxi-LKM-${STAMP}.zip"
          ZIP_DEV="Fuxi-LKM-devkit-${STAMP}.zip"

          # --- AnyKernel3 刷机包 (仅 Image, 无 rekernel) ---
          if [ ! -d tools/AK3 ]; then
            echo "tools/AK3 missing" >&2
            exit 1
          fi
          rm -rf out/AK3
          cp -a tools/AK3 out/AK3
          cp -f out/arch/arm64/boot/Image out/AK3/Image
          # 说明文件
          cat > out/AK3/LKM-README.txt <<EOF
          Fuxi LKM-friendly kernel
          KERNELRELEASE=${KERNELRELEASE}
          LOCALVERSION=${LOCALVERSION}
          REKERNEL=disabled
          KSU=${KSU_ENABLED:-unknown}
          LTO=${LTO:-unknown}
          Build: ${{ github.run_number }} / ${{ github.sha }}
          EOF
          (
            cd out/AK3
            zip -r9 "../../${ZIP_KERNEL}" .
          )

          # --- 开发包: 编任意 out-of-tree .ko 所需最小集合 ---
          DEV=out/lkm-devkit
          rm -rf "$DEV"
          mkdir -p "$DEV"
          cp -f out/Module.symvers "$DEV/"
          cp -f out/.config "$DEV/config"
          cp -f out/System.map "$DEV/" 2>/dev/null || true
          cp -f out/arch/arm64/boot/Image "$DEV/"
          echo "${KERNELRELEASE}" > "$DEV/kernelrelease"
          echo "${LOCALVERSION}" > "$DEV/localversion"
          echo "${{ github.sha }}" > "$DEV/source-commit"
          # modules_prepare 关键文件树 (external module 编译常用)
          if [ -d out/include ]; then
            mkdir -p "$DEV/build-out"
            # 只打包 out 里对 M= 有用的生成物, 控制体积
            rsync -a \
              --include='Module.symvers' \
              --include='.config' \
              --include='System.map' \
              --include='Makefile' \
              --include='include/***' \
              --include='arch/arm64/include/***' \
              --include='scripts/***' \
              --include='tools/objtool/***' \
              --exclude='*' \
              out/ "$DEV/build-out/" || true
            # 完整 scripts 在源码树; 开发时仍建议配合本 commit 源码
          fi
          if [ -d out/lkm-smoke ]; then
            cp -a out/lkm-smoke "$DEV/"
          fi
          # 树内 .ko 若有, 附带一份清单 (不是刷机必需)
          if [ "${BUILD_TREE_MODULES:-true}" != "false" ]; then
            mkdir -p "$DEV/tree-modules"
            find out -name '*.ko' -type f | head -5 | while read -r k; do
              echo "sample: $k"
            done
            find out -name '*.ko' -type f > "$DEV/tree-modules/modules.list" || true
            KO_COUNT="$(wc -l < "$DEV/tree-modules/modules.list" | tr -d ' ')"
            echo "tree_ko_count=${KO_COUNT}" | tee "$DEV/tree-modules/count.txt"
          fi

          cat > "$DEV/README-LKM.md" <<EOF
          # Fuxi LKM Devkit

          ## 刷机
          刷 \`${ZIP_KERNEL}\` (AnyKernel3)。

          ## 编译任意 out-of-tree .ko

          1. 检出与 \`source-commit\` 相同的内核源码
          2. 使用**同一套** Neutron Clang (或构建日志中的 clang)
          3. 将本 devkit 的 \`Module.symvers\` / \`.config\` 对齐到 \`O=\` 目录, 或:

          \`\`\`bash
          export ARCH=arm64
          export PATH=\"/path/to/clang/bin:\$PATH\"
          make LLVM=1 LLVM_IAS=1 O=out LOCALVERSION=${LOCALVERSION} fuxi_defconfig
          # 按 workflow 同样关闭 REKERNEL / LTO 等后再 olddefconfig
          make LLVM=1 LLVM_IAS=1 O=out LOCALVERSION=${LOCALVERSION} modules_prepare
          # 把本包 Module.symvers 拷到 out/
          make LLVM=1 LLVM_IAS=1 -C out M=/path/to/your/module modules
          \`\`\`

          ## 加载
          \`\`\`bash
          insmod your.ko
          # 或
          modprobe your
          \`\`\`

          vermagic 必须与运行中 \`uname -r\` (= ${KERNELRELEASE}) 一致。

          ## 本构建策略
          - Re:Kernel: **未编入**
          - CONFIG_MODULES / MODULE_UNLOAD: 开启
          - MODULE_SIG 强制: 关闭
          - TRIM_UNUSED_KSYMS: 关闭
          - ThinLTO: ${LTO:-unknown}
          - KSU: ${KSU_ENABLED:-unknown}
          EOF

          (
            cd "$DEV"
            zip -r9 "../../${ZIP_DEV}" .
          )

          ls -lh "${ZIP_KERNEL}" "${ZIP_DEV}"
          echo "ZIP_KERNEL=${ZIP_KERNEL}" >> "$GITHUB_ENV"
          echo "ZIP_DEV=${ZIP_DEV}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Fuxi-LKM-${{ github.run_number }}
          path: |
            Fuxi-LKM-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Telegram (optional)
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -z "${TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "Telegram skipped"
            exit 0
          fi
          NL=$'\n'
          CAPTION="✅ Fuxi LKM 内核${NL}✅ release: ${KERNELRELEASE}${NL}✅ ReKernel: OFF${NL}✅ KSU: ${KSU_ENABLED:-?}${NL}✅ LTO: ${LTO:-?}${NL}✅ 含 devkit (Module.symvers)${NL}构建号: LKM-${{ github.run_number }}"
          for f in ${ZIP_KERNEL} ${ZIP_DEV}; do
            curl -s -F chat_id="$CHAT_ID" \
              -F document=@"$f" \
              -F "caption=$CAPTION" \
              "https://api.telegram.org/bot${TOKEN}/sendDocument" >/dev/null || true
          done

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="LKM-Build-${{ github.run_number }}"
          NOTES=$(cat <<EOF
          ## Fuxi LKM-friendly kernel #${{ github.run_number }}

          - **KERNELRELEASE**: \`${KERNELRELEASE}\`
          - **Re:Kernel**: disabled (not built-in)
          - **KSU**: ${KSU_ENABLED:-unknown}
          - **LTO**: ${LTO:-unknown}
          - **Commit**: ${{ github.sha }}

          ### Artifacts
          - \`${ZIP_KERNEL}\` — AnyKernel3 flashable Image
          - \`${ZIP_DEV}\` — Module.symvers + config + smoke hello.ko + notes

          Out-of-tree modules must match vermagic / this release.
          EOF
          )
          gh release create "$TAG" ${ZIP_KERNEL} ${ZIP_DEV} \
            --repo "${{ github.repository }}" \
            --title "LKM 内核 #${{ github.run_number }}" \
            --notes "$NOTES" \
            || gh release upload "$TAG" ${ZIP_KERNEL} ${ZIP_DEV} --repo "${{ github.repository }}" --clobber
